<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#071525">

    <title>Takeoff</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-shell">

    <header class="topbar">

        <div>
            <div class="eyebrow">FLIGHT PLANNING</div>
            <h1>TAKEOFF</h1>
        </div>

        <div class="app-badge">
            <span>VFR</span>
            <strong>Weather</strong>
        </div>

    </header>

    <main>

        <section class="panel">

            <h2>Flight Details</h2>

            <div class="field">
                <label for="departure">Departure</label>
                <input
                    id="departure"
                    type="text"
                    maxlength="4"
                    placeholder="NZCH"
                    autocomplete="off"
                    autocapitalize="characters">
            </div>

            <div class="field">
                <label for="destination">Destination</label>
                <input
                    id="destination"
                    type="text"
                    maxlength="4"
                    placeholder="NZQN"
                    autocomplete="off"
                    autocapitalize="characters">
            </div>

            <div class="field">
                <label for="altitude">Cruise Altitude</label>
                <input
                    id="altitude"
                    type="text"
                    placeholder="6500 ft">
            </div>

            <div class="field">
                <label for="departureTime">Departure Time</label>
                <input
                    id="departureTime"
                    type="time">
            </div>

            <button class="secondary" onclick="reverseRoute()">
                🔄 Reverse Route
            </button>

            <button class="primary" onclick="getWeather()">
                🌦 Get Weather
            </button>

            <button class="secondary" onclick="reviewFlight()">
                📋 Review Flight
            </button>

        </section>

        <section class="panel">

            <h2>Weather Briefing</h2>

            <div id="weatherResult">
                Enter a departure and destination then tap
                <strong>Get Weather</strong>.
            </div>

        </section>

        <section class="panel">

            <h2>Flight Review</h2>

            <div id="reviewResult">
                No flight loaded.
            </div>

        </section>

    </main>

</div>

<script src="app.js"></script>
</body>
</html>
