<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#081726">
  <title>Takeoff</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">FLIGHT PLANNING</div>
        <h1>TAKEOFF</h1>
      </div>
      <div class="app-badge"><span>VFR</span><strong>WEATHER</strong></div>
    </header>

    <main>
      <section class="panel route-panel" aria-labelledby="routeHeading">
        <div class="panel-heading-row">
          <div>
            <p class="section-kicker">PLAN YOUR ROUTE</p>
            <h2 id="routeHeading">ROUTE</h2>
          </div>
          <p class="required-note">DEPARTURE ONLY REQUIRED</p>
        </div>

        <div class="route-row route-primary-row">
          <label class="field field-departure">
            <span>DEPARTURE</span>
            <input id="departure" list="locationList" autocomplete="off" placeholder="ASHBURTON OR NZAS">
          </label>

          <button id="reverseButton" class="reverse-button" type="button" aria-label="Reverse complete route">⇄</button>

          <label class="field field-via">
            <span>VIA 1</span>
            <input id="waypoint1" list="locationList" autocomplete="off" placeholder="OPTIONAL">
          </label>

          <label class="field field-via">
            <span>VIA 2</span>
            <input id="waypoint2" list="locationList" autocomplete="off" placeholder="OPTIONAL">
          </label>

          <label class="field field-destination">
            <span>DESTINATION</span>
            <input id="destination" list="locationList" autocomplete="off" placeholder="OPTIONAL FOR LOCAL FLIGHT">
          </label>
        </div>

        <div class="route-row route-secondary-row">
          <label class="field compact-field day-field">
            <span>DAY</span>
            <select id="daySelect"></select>
          </label>

          <label class="field compact-field time-field" id="departureTimeField">
            <span>TIME</span>
            <div class="time-control">
              <button id="departureTimeButton" class="time-button" type="button" aria-haspopup="dialog" aria-controls="timePickerOverlay">
                <span id="departureTimeValue">--:--</span>
                <span class="time-button-icon" aria-hidden="true">▾</span>
              </button>
              <input id="departureTime" type="hidden" value="">
            </div>
          </label>

          <label class="field compact-field speed-field">
            <span>SPEED</span>
            <input id="cruiseSpeed" type="number" min="40" max="300" step="1" value="110" inputmode="numeric">
          </label>
        </div>

        <button id="briefingButton" class="primary-button" type="button">GET ROUTE WEATHER BRIEFING</button>
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      </section>

      <section id="briefingPanel" class="panel briefing-panel" hidden>
        <div id="briefingHeader"></div>
        <div id="limitingBanner"></div>
        <div id="weatherCards" class="weather-cards" aria-label="Route weather summaries"></div>
        <div class="map-wrap">
          <div class="map-title-row"><h2>ROUTE MAP</h2><span id="mapStatus"></span></div>
          <div id="routeMap" aria-label="Interactive route map"></div>
        </div>
      </section>
    </main>

    <footer>
      Forecast information only. Confirm conditions using official aviation weather, NOTAM and operational sources.
    </footer>
  </div>

  <datalist id="locationList"></datalist>
  <div id="loadingOverlay" class="loading-overlay" hidden>
    <div class="loading-card">
      <div class="spinner"></div>
      <p id="loadingMessage">BUILDING ROUTE WEATHER BRIEFING…</p>
    </div>
  </div>

  <div id="timePickerOverlay" class="time-picker-overlay" hidden>
    <div class="time-picker-sheet" role="dialog" aria-modal="true" aria-labelledby="timePickerTitle">
      <div class="time-picker-header">
        <strong id="timePickerTitle">SELECT DEPARTURE TIME</strong>
        <div class="time-picker-actions">
          <button id="timePickerCancel" class="time-picker-action time-picker-cancel" type="button">CANCEL</button>
          <button id="timePickerDone" class="time-picker-action time-picker-done" type="button">DONE</button>
        </div>
      </div>
      <div class="time-picker-wheel-frame">
        <div id="timePickerWheel" class="time-picker-wheel" aria-label="Departure time options"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="app.js"></script>
</body>
</html>
